[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oohscout-ai"
version = "0.0.1"
description = "AI-assisted OOH billboard site intelligence for Texas highway corridors"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Notebook runtime
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
    "python-dotenv",
    # Geospatial data layer (Track A foundation)
    "geopandas",
    "osmnx",
    "pyproj",
    "pystac-client",
    "rasterio",
    "shapely",
    "contextily",
    # Track A analytics (Milan's UA Advanced course)
    "pandana",         # UA Ch 3 — accessibility isochrones
    "libpysal",        # UA Ch 6 — spatial weights
    "esda",            # UA Ch 6 — exploratory spatial data analysis
    "spreg",           # UA Ch 6 — spatial regression (ML_Lag)
    "mapclassify",     # UA Ch 4 — classification schemes
    "statsmodels",     # UA Ch 6 — OLS baseline
    # Scientific + visualization
    "folium",
    "geopy",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "pillow",
    "scikit-image",
    "scikit-learn",
    "scipy",
    # Machine-learning layer (GeoAI Ch 5, 7 — Track A visibility)
    "open-clip-torch",
    "torch",
    "torchinfo",
    "torchvision",
    # Track B — Regulatory RAG (Phase 3)
    "anthropic",           # Claude for LLM tasks
    "pgvector",            # vector store
    "psycopg[binary]",     # PostgreSQL client
    "pydantic",            # structured schemas
    # Track C — Agent (Phase 4)
    "groq",                # Milan's Ch 14 default
    "huggingface-hub",
    # Optional (defer to later phases)
    "earthengine-api",     # GeoAI Ch 13
    "geotessera",
    "segment-geospatial",  # GeoAI Ch 13 SAM
    "pyyaml>=6.0.3",
]

# F1a — package the backend/src/oohscout tree as the importable `oohscout` module.
# Hatchling needs an explicit sources map because our layout is
# `backend/src/oohscout/` (non-standard) rather than `src/oohscout/`.
[tool.hatch.build.targets.wheel]
packages = ["backend/src/oohscout"]

[tool.hatch.build.targets.wheel.sources]
"backend/src" = ""

# PyPI serves CPU-only PyTorch wheels on Windows. Pin the Windows install to
# the official CUDA 13.0 index so this workstation's NVIDIA GPU is usable.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# --basetemp anchors tmp_path under the project because Windows AppData Temp
# occasionally acquires ACLs pytest can't enumerate. Local dir is gitignored.
addopts = "-ra -q --basetemp=.pytest_tmp"
