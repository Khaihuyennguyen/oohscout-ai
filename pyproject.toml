[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oohscout-ai"
version = "0.0.1"
description = "AI-assisted OOH billboard site intelligence for Texas highway corridors"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-dotenv",
    "pydantic",
    "pyyaml>=6.0.3",
    "mcp>=2.1.1",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn",
]
notebook = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]
vector = [
    "geopandas",
    "osmnx",
    "pyproj",
    "shapely",
    "contextily",
    "geopy",
    "folium",
    "pandana",
    "libpysal",
    "esda",
    "spreg",
    "mapclassify",
    "statsmodels",
]
raster = [
    "rasterio",
    "pystac-client",
]
science = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "pillow",
    "scikit-image",
    "scikit-learn",
    "scipy",
]
ml = [
    "open-clip-torch",
    "torch",
    "torchinfo",
    "torchvision",
    "huggingface-hub",
    "earthengine-api",
    "geotessera",
    "segment-geospatial",
]
postgis = [
    "psycopg[binary]",
    "pgvector",
]
agent = [
    "anthropic",
    "groq",
]
all = [
    "oohscout-ai[api,notebook,vector,raster,science,ml,postgis,agent]"
]
test = [
    "oohscout-ai[all]"
]

# F1a — package the backend/src/oohscout tree as the importable `oohscout` module.
[tool.hatch.build.targets.wheel]
packages = ["backend/src/oohscout"]

[tool.hatch.build.targets.wheel.sources]
"backend/src" = ""

# PyPI serves CPU-only PyTorch wheels on Windows. Pin the Windows install to
# the official CUDA 13.0 index so this workstation's NVIDIA GPU is usable.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",         # [NEW] Added for linting
    "nbstripout"    # [NEW] Added to strip notebook outputs
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra -q --basetemp=.pytest_tmp"
